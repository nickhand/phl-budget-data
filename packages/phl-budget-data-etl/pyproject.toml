[project]
name = "phl-budget-data-etl"
version = "0.1.0"
description = "ETL tools for phl-budget-data (development only)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nick Hand", email = "nick.hand@phila.gov" }]
dependencies = [
    "phl-budget-data",
    "pydantic>=2.0",
    "loguru>=0.5",
    "typer>=0.9",
    "selenium>=4.10",
    "pdfplumber>=0.7.5",
    "requests>=2.27",
    "intervaltree>=3.1",
    "python-dotenv>=0.19",
    "boto3>=1.17",
    "beautifulsoup4>=4.9",
    "pdfminer-six>=20220524",
    "questionary>=2.0",
]

[project.scripts]
phl-budget-data = "phl_budget_data_etl.cli.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "jupyterlab>=3",
    "matplotlib>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
phl-budget-data = { workspace = true }
